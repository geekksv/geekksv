<svg xmlns="http://www.w3.org/2000/svg" width="880" height="190" viewBox="0 0 880 190" role="img" aria-label="keshav kumar, linux  /  devops  /  telephony  /  automation">
  <title>keshav kumar — linux  /  devops  /  telephony  /  automation</title>
  <style>
    .mono { font-family: ui-monospace,SFMono-Regular,&#x27;SF Mono&#x27;,Menlo,Consolas,&#x27;Liberation Mono&#x27;,monospace; }
    .cursor { animation: blink 1.1s steps(1, end) infinite; }
    @keyframes blink { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .cursor { animation: none; }
    }
  </style>

  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#2ea043" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#2ea043" stop-opacity="1"/>
      <stop offset="0.82" stop-color="#3fb950" stop-opacity="1"/>
      <stop offset="1"    stop-color="#3fb950" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card">
      <rect x="8" y="8" width="864" height="174" rx="12"/>
    </clipPath>
  </defs>

  <!-- card -->
  <rect x="8" y="8" width="864" height="174" rx="12" fill="#0d1117" stroke="#21262d" stroke-width="1"/>

  <g clip-path="url(#card)">
    <!-- title bar -->
    <rect x="8" y="8" width="864" height="40" fill="#161b22"/>
    <!-- the lit top edge -->
    <rect x="8" y="8" width="864" height="2" fill="url(#edge)"/>
  </g>
  <line x1="8" y1="48" x2="872" y2="48" stroke="#21262d" stroke-width="1"/>

  <!-- window buttons -->
  <circle cx="34" cy="28" r="6" fill="#ff5f56"/>
  <circle cx="54" cy="28" r="6" fill="#ffbd2e"/>
  <circle cx="74" cy="28" r="6" fill="#27c93f"/>

  <text class="mono" x="440.0" y="33" text-anchor="middle" font-size="13" fill="#8b949e">keshav@github</text>

  <!-- prompt -->
  <text class="mono" x="40" y="88" font-size="14.5">
    <tspan fill="#3fb950" font-weight="600">ksv@macbook</tspan><tspan fill="#6e7681"> : ~ $ </tspan><tspan fill="#c9d1d9">id -un</tspan>
  </text>

  <!-- status -->
  <circle cx="772" cy="83" r="4.5" fill="#3fb950"/>
  <text class="mono" x="840" y="88" text-anchor="end" font-size="13" fill="#8b949e">online</text>

  <!-- the answer -->
  <text class="mono" x="40" y="132" font-size="31" font-weight="700" fill="#58a6ff" letter-spacing="0.5">keshav kumar</text>

  <!-- what that means -->
  <text class="mono" x="40" y="162" font-size="13" fill="#8b949e">linux  /  devops  /  telephony  /  automation<tspan class="cursor" fill="#58a6ff" font-weight="700" dx="14">&#x2588;</tspan></text>
</svg>
