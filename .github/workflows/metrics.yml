name: Metrics

# Draws the 3D isometric contribution calendar into assets/.
# Needs its own token: the built-in GITHUB_TOKEN cannot read profile-level data,
# which is the usual cause of this job failing with an empty result.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  calendar:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          # Relative to the repo root, not to any default folder. A bare
          # "metrics.isocalendar.svg" writes it beside the README while the README
          # looks for it in assets/ — the run goes green and the image stays broken.
          filename: assets/metrics.isocalendar.svg
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          config_timezone: Asia/Kolkata
          output_action: commit
          committer_branch: main
          committer_message: "chore: refresh contribution calendar"
